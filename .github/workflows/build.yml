name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache runtime components
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/bundled_components
          key: components-${{ hashFiles('tools/components.sha256') }}

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      # Robolectric downloads its android-all-instrumented jars (~350 MB) into ~/.m2/repository
      # itself. app/build.gradle.kts points that fetch at Maven Central's Google mirror, so a cold
      # runner survives the 429s repo1.maven.org returns to shared CI IPs; this cache then makes
      # repeat runs download nothing at all.
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests
        run: ./gradlew testModernDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleModernDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/modern/debug/*.apk
          # Private-repo artifacts count against the account's Actions storage; keep them one day.
          retention-days: ${{ github.event.repository.private && 1 || 14 }}
